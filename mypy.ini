[mypy]
python_version = 3.14
strict = True
disallow_any_explicit = True
disallow_any_unimported = True
warn_unused_configs = True
cache_dir = var/typecheck-cache
# First enforced contracts; this list must grow with the main-chain conversion.
# No import skipping, per-module suppression, or repository-wide passing claim.
files = workbench/data_contracts.py, workbench/research_records.py, workbench/execution_scope.py, workbench/publication_contracts.py, workbench/candidate_contracts.py, workbench/author_execution.py, workbench/verification_contracts.py
